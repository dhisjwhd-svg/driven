<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Yuki</title>
<style>
html,body{margin:0;min-height:100%;background:#080a10;color:#f5f7ff;font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#status{min-height:100vh;display:grid;place-content:center;text-align:center;gap:12px;color:#c9d0e4}
#status:before{content:"";width:28px;height:28px;border:2px solid #34394b;border-top-color:#dce3ff;border-radius:50%;animation:spin .7s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="status">Loading the latest Yuki module…</div>
<script>
(async function(){
 const status=document.getElementById('status');
 try{
  const response=await fetch('https://raw.githubusercontent.com/dhisjwhd-svg/driven/main/YUKI-moudle.html.html',{cache:'no-store'});
  if(!response.ok)throw new Error('Could not load the source module ('+response.status+').');
  let html=await response.text();
  const oldSeason="function seasonList(s){\n    if(s.seasons && s.seasons.length) return s.seasons;\n    return [{ name:'Season 1', eps: s.eps||[] }];\n  }";
  const fixedSeason=`function episodeNumber(ep,i){
    var explicit=Number(ep&&(ep.episode||ep.episodeNumber||ep.ep||ep.number));
    if(explicit>0)return explicit;
    var label=[ep&&ep.label,ep&&ep.name,ep&&ep.title].filter(Boolean).join(' ');
    var m=label.match(/s\\s*\\d+\\s*e\\s*0*(\\d+)/i)||label.match(/(?:episode|ep|part)\\s*0*(\\d+)/i)||label.match(/(?:^|\\D)(\\d{1,3})(?:\\D|$)/);
    return Number(m&&m[1])||i+1;
  }
  function seasonNumber(se,i){
    var explicit=Number(se&&(se.season||se.seasonNumber||se.number));
    if(explicit>0)return explicit;
    var label=String(se&&(se.name||se.title)||'');
    var m=label.match(/season\\s*0*(\\d+)/i)||label.match(/\\bs\\s*0*(\\d+)\\b/i);
    return Number(m&&m[1])||i+1;
  }
  function sortEpisodes(eps){
    return (eps||[]).map(function(ep,i){return {ep:ep,i:i,n:episodeNumber(ep,i)};})
      .sort(function(a,b){return a.n-b.n||a.i-b.i;}).map(function(x){return x.ep;});
  }
  function seasonList(s){
    var raw=Array.isArray(s.seasons)?s.seasons.map(function(se){return Object.assign({},se,{eps:(se.eps||[]).slice()});}):[];
    var eps=Array.isArray(s.eps)?s.eps.slice():[];
    var groups={};
    eps.forEach(function(ep){
      var label=[ep&&ep.label,ep&&ep.name,ep&&ep.title,ep&&ep.url].filter(Boolean).join(' ');
      var explicit=Number(ep&&(ep.season||ep.seasonNumber));
      var match=label.match(/s\\s*0*(\\d+)\\s*e\\s*0*\\d+/i)||label.match(/season\\s*0*(\\d+)/i);
      var n=explicit||Number(match&&match[1])||1;
      (groups[n]||(groups[n]=[])).push(ep);
    });
    Object.keys(groups).forEach(function(key){
      var n=Number(key),existing=raw.find(function(se,i){return seasonNumber(se,i)===n;});
      if(existing) existing.eps=(existing.eps||[]).concat(groups[key]);
      else raw.push({name:'Season '+n,season:n,eps:groups[key]});
    });
    if(!raw.length)raw=[{name:'Season 1',season:1,eps:eps}];
    raw.forEach(function(se,i){
      se.season=seasonNumber(se,i);
      se.name=se.name||('Season '+se.season);
      se.eps=sortEpisodes(se.eps||[]);
      var seen={};
      se.eps=se.eps.filter(function(ep,j){
        var key=String(ep&&(ep.id||ep.url||ep.embed||ep.label||ep.name)||j);
        if(seen[key])return false;
        seen[key]=true;return true;
      });
    });
    raw.sort(function(a,b){return a.season-b.season;});
    return raw;
  }`;
  if(!html.includes(oldSeason))throw new Error('The source module changed its season logic; no unsafe patch was applied.');
  html=html.replace(oldSeason,fixedSeason);
  html=html.replace("return (se && se.eps) ? se.eps : (cur.eps||[]);","return (se && se.eps) ? sortEpisodes(se.eps) : sortEpisodes(cur.eps||[]);");
  html=html.replace("var en=(s.eps&&s.eps.length)||0;","var en=seasonList(s).reduce(function(total,se){return total+((se.eps&&se.eps.length)||0);},0);");
  status.remove();
  document.open();document.write(html);document.close();
 }catch(e){status.textContent='Yuki could not load: '+e.message;status.style.color='#fb7185';}
})();
</script>
</body>
</html>
